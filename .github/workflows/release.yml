name: Release & Package Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Linux x86_64 Release Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            libgmp-dev \
            nettle-dev \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build Admin UI
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Cache Cargo registry and release build
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p ferrum -p ferrum-verifier --locked

      - name: Stage and package distributable tarball
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/ferrum-linux-x86_64"
          rm -rf "${STAGE_DIR}"
          mkdir -p \
            "${STAGE_DIR}/bin" \
            "${STAGE_DIR}/share/ferrum/ui" \
            "${STAGE_DIR}/deploy"

          install -m 0755 target/release/ferrum "${STAGE_DIR}/bin/ferrum"
          install -m 0755 target/release/ferrum-verifier "${STAGE_DIR}/bin/ferrum-verifier"
          cp -r ui/build "${STAGE_DIR}/share/ferrum/ui/build"
          cp -r deploy/* "${STAGE_DIR}/deploy/"
          cp README.md "${STAGE_DIR}/README.md"

          tar -C "${RUNNER_TEMP}" -czf ferrum-linux-x86_64.tar.gz ferrum-linux-x86_64
          sha256sum ferrum-linux-x86_64.tar.gz > ferrum-linux-x86_64.tar.gz.sha256
          cat ferrum-linux-x86_64.tar.gz.sha256

      - name: Upload downloadable release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-linux-x86_64
          path: |
            ferrum-linux-x86_64.tar.gz
            ferrum-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ferrum-linux-x86_64.tar.gz
            ferrum-linux-x86_64.tar.gz.sha256
