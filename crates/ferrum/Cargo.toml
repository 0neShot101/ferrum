[package]
name = "ferrum"
description = "Ferrum APT mirror gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[features]
default = []
test-harness = ["ferrum-storage/test-harness"]

[[test]]
name = "gateway"
required-features = ["test-harness"]

[[test]]
name = "signed_fixture"
required-features = ["test-harness"]

[[test]]
name = "s3_gateway"
required-features = ["test-harness"]

[[test]]
name = "publication"
path = "tests/publication.rs"
required-features = ["test-harness"]


[[test]]
name = "admin_dashboard"
path = "tests/admin_dashboard.rs"
required-features = ["test-harness"]
[[example]]
name = "http_benchmark"
required-features = ["test-harness"]

[[example]]
name = "distribution_harness"
required-features = ["test-harness"]

[[bin]]
name = "ferrum"
path = "src/main.rs"

[dependencies]
ferrum-apt.workspace = true
ferrum-storage.workspace = true
anyhow.workspace = true
argon2 = "0.5.3"
fd-lock.workspace = true
libc = "0.2"
rusqlite.workspace = true
rustix = { workspace = true, features = ["process"] }
flate2.workspace = true
arc-swap.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures-util.workspace = true
http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit = "0.22"
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
ferrum-fixture-origin = { path = "../ferrum-fixture-origin" }
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
