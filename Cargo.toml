[workspace]
resolver = "3"
members = [
    "crates/ferrum-apt",
    "crates/ferrum-storage",
    "crates/ferrum",
    "crates/ferrum-fixture-origin",
    "crates/ferrum-verifier",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/0neShot101/ferrum"
license = "MIT"
publish = false

[workspace.dependencies]
ferrum-apt = { path = "crates/ferrum-apt" }
ferrum-storage = { path = "crates/ferrum-storage" }

anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-smithy-http-client = { version = "=1.5.0", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "=1.19.0", features = ["client", "http-1x"] }
aws-smithy-types = { version = "=1.8.1", features = ["http-body-1-x", "rt-tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
deb822-fast = "0.2.3"
fd-lock = "4.0.4"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
http = "1.5.0"
http-body = "=1.1.0"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful", "service", "http1"] }
percent-encoding = "2.3.2"
quick-xml = "=0.42.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "hooks"] }
rustix = { version = "1.1.4", features = ["fs"] }
flate2 = "1.1.10"
bzip2 = "=0.6.1"
xz2 = "=0.1.7"
ruzstd = "=0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
xmlparser = "=0.13.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
debug = 1
