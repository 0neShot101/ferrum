# State, provider, suites and budgets must match gateway.toml.
state_directory = '/var/lib/ferrum/state'
# If overriding gateway suites, repeat that exact active selection here.
# suites = ['debian/trixie', 'ubuntu/noble']
# Move retired identities here as well as gateway durable.retired_suites.
retired_suites = []

[provider]
# Supported S3 providers:
# - AWS S3: set `region = 'us-east-1'` (endpoint defaults to https://s3.<region>.amazonaws.com)
# - Cloudflare R2: set `provider = 'cloudflare-r2'` and `account_id = '<account_id>'` (region defaults to 'auto')
# - IDrive e2: set `provider = 'idrive-e2'` and `region = 'us-central-1'` (endpoint resolves to https://s3.<region>.idrivee2.com)
# - Custom S3-compatible: set `endpoint = 'https://...'` and `region = '...'`
region = 'us-east-1'
bucket = 'ferrum'
credentials_file = '/var/lib/ferrum/private/provider.env'
# Optional (defaults shown):
# package_prefix = 'linux-packages/'
# checkpoint_prefix = 'linux-checkpoints/'
# shared_nonisolated = true

[budget]
storage_bytes = 1099511627776
storage_control_bytes = 107374182400
monthly_download_bytes = 1099511627776
download_control_bytes = 107374182400
