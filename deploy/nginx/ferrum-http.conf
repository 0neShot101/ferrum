# HTTP-context limits also protect the default/reject listeners before Host is parsed.
merge_slashes off;
access_log off;
client_header_buffer_size 4k;
large_client_header_buffers 4 32k;
client_header_timeout 10s;
client_max_body_size 1k;
client_body_buffer_size 1k;
client_body_timeout 5s;
send_timeout 30s;
keepalive_timeout 15s;
keepalive_requests 1000;
keepalive_time 5m;
lingering_time 5s;
lingering_timeout 2s;
reset_timedout_connection on;

# An empty value omits Allow on GET/HEAD responses.
map $request_method $ferrum_allow {
    default "GET, HEAD";
    GET "";
    HEAD "";
}
