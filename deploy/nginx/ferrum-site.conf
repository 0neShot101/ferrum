# Ferrum optional public TLS edge (only needed for `mode = 'public-durable'`).
# Replace `mirror.example.com` and the certificate paths with your own domain.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name "";
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name "";
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name mirror.example.com;

    add_header Allow $ferrum_allow always;
    add_header Cache-Control "no-store" always;
    if ($host != $server_name) {
        return 444;
    }
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 "";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/ferrum-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        return 404 "";
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mirror.example.com;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/mirror.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirror.example.com/privkey.pem;
    ssl_session_cache shared:FerrumTLS:4m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    include /etc/nginx/snippets/ferrum-boundary.conf;
}
