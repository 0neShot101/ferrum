# Disabled Ferrum boundary snippet (returns 503 for all repository paths).
if ($host != ferrum.oneshot.wtf) {
    return 444;
}
if ($request_method !~ ^(GET|HEAD)$) {
    return 405;
}

sendfile on;
tcp_nopush on;
gzip off;
autoindex off;
add_header Cache-Control "no-store" always;
add_header Allow $ferrum_allow always;

location = /healthz {
    default_type text/plain;
    return 200 "ferrum-edge: boundary-only; repositories unavailable\n";
}

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/ferrum-acme;
    default_type text/plain;
    try_files $uri =404;
}

location ~ ^/(fixture|admin|internal|metrics|health|readyz|livez)(/|$) {
    return 404;
}

location / {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    add_header Allow $ferrum_allow always;
    return 503 "Ferrum repositories are not publicly qualified.\n";
}
