# Active Ferrum HTTPS proxy boundary snippet.
# Included inside the port 443 server block in `ferrum-site.conf`.
# Uses `$server_name` from the enclosing server block so no hostname is hardcoded here.
if ($host != $server_name) {
    return 444;
}

sendfile on;
tcp_nopush on;
gzip off;
autoindex off;

# Edge liveness only: never forwards private application health or metrics.
location = /healthz {
    add_header Allow $ferrum_allow always;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 "";
    }
    default_type text/plain;
    return 200 "ferrum-edge: ok\n";
}

# Public HTTP-01 tokens only, never accounts or keys.
location ^~ /.well-known/acme-challenge/ {
    add_header Allow $ferrum_allow always;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 "";
    }
    root /var/lib/ferrum-acme;
    default_type text/plain;
    try_files $uri =404;
}

# Private fixture and administrative surfaces are never publicly routed.
location ~ ^/(fixture|admin|internal|metrics|health|readyz|livez)(/|$) {
    add_header Allow $ferrum_allow always;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405 "";
    }
    return 404 "";
}

# Forward original escaped request target to Ferrum HTTP/1.1 listener.
location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $server_name;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:8080;
}
